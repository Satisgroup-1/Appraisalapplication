name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
            pattern: release/*.exe
          - os: macos-latest
            artifact: mac-dmg
            pattern: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Unsigned builds: Windows SmartScreen / macOS Gatekeeper will warn on
      # first run. Add certificates as repo secrets and electron-builder
      # signing config when available.
      - run: npx electron-builder --publish never ${{ runner.os == 'Windows' && '--win' || '--mac' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # Tag pushes (v*) publish the freshly built installers as a GitHub
  # Release, giving the website stable public download URLs:
  #   .../releases/latest/download/Satis-Appraisal-Setup.exe
  #   .../releases/latest/download/Satis-Appraisal.dmg
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
