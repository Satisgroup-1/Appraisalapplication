name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0); leave empty to just build"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
            pattern: release/*.exe
          - os: macos-latest
            artifact: mac-dmg
            pattern: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Unsigned builds: Windows SmartScreen / macOS Gatekeeper will warn on
      # first run. Add certificates as repo secrets and electron-builder
      # signing config when available.
      - run: npx electron-builder --publish never ${{ runner.os == 'Windows' && '--win' || '--mac' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # Tag pushes (v*) publish the freshly built installers as a GitHub
  # Release, giving the website stable public download URLs:
  #   .../releases/latest/download/Satis-Appraisal-Setup.exe
  #   .../releases/latest/download/Satis-Appraisal.dmg
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      # target_commitish pins the tag to the commit this run actually built.
      # Without it, a dispatch-cut release creates its tag through the API,
      # where the target defaults to the repository's DEFAULT BRANCH — so
      # v0.2.4's tag landed on a stale feature branch while the installers
      # attached to it were built from main. The binaries were right and the
      # tag was wrong, which is the worst version of that bug: nothing looks
      # broken until someone checks out the tag and gets a different tree.
      # github.sha is the built commit under both triggers — the tag's commit
      # on a tag push, the dispatched ref's tip on a manual run.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
